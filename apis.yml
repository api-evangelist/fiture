name: Fiture
description: 'Fiture is a consumer smart-home fitness company that makes interactive
  AI-powered fitness mirrors for at-home workouts. Its hardware line includes the Fiture
  Core flagship mirror and the compact Fiture Mini, each pairing a wall-mounted display
  with a camera and on-device AI that delivers real-time motion tracking, gesture recognition,
  rep counting, and posture feedback across a library of live and on-demand fitness
  classes sold through a membership. The company was founded in China and is backed
  by venture investor Hongshan (formerly Sequoia Capital China). Fiture operates a
  direct-to-consumer commerce and membership website but does not currently publish
  a public developer program, API, or SDK; this API Evangelist profile tracks the company
  and its public web surface (support, legal, and account pages).'
